# Rakta Bandhan edge Worker. Deploy with `npm run deploy` (see docs/launch/SPARK_NOW.md).
name = "rakta-bandhan-edge"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Photos live here. Create the bucket once: `npx wrangler r2 bucket create rakta-bandhan-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rakta-bandhan-media"

[vars]
FIREBASE_PROJECT_ID = "rakta-bandhan2026"
# Browser origins allowed to call the private routes (admin console, web build).
# The phone app is not a browser and needs no entry.
ALLOWED_ORIGINS = "https://rakta-bandhan2026.web.app,https://rakta-bandhan2026.firebaseapp.com"

# Secrets (never in this file):
#   npx wrangler secret put TURN_KEY_ID      # Cloudflare dashboard > Realtime > TURN
#   npx wrangler secret put TURN_API_TOKEN
# Unset, the /ice route answers with STUN servers only.
